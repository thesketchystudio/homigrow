# .github/workflows/backend-ci.yml
# Lints and tests the FastAPI backend on every PR touching backend/.
# Runs against an ephemeral Postgres+PostGIS service container, not the
# Supabase dev/prod databases.

name: Backend CI

on:
  pull_request:
    branches: [dev, main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: homigrow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      # Credentials for the ephemeral service container above.
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: homigrow_ci
      DB_USER: postgres
      DB_PASSWORD: postgres
      ENVIRONMENT: dev
      # Signs JWTs issued against the ephemeral CI database only — not a
      # real secret, so a hardcoded value is fine here (same reasoning as
      # DB_PASSWORD above), no GitHub secret needed.
      JWT_SECRET: ci-test-secret-never-used-outside-this-workflow
      # SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check app tests alembic

      - name: Apply migrations, verify downgrade, re-apply
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Run tests
        run: pytest -v
